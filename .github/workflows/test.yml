name: test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: sudo apt-get update && sudo apt-get install -y clojure
      - run: clojure -cp src:test -m rule-evaluator-test
      - run: clojure -cp src:test -m rule-evaluator fixtures/rules.edn fixtures/events.edn
